[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "quantfoundry-sdk"
dynamic = ["version"]
requires-python = ">=3.12,<3.13"
description = "Quant Foundry S3 contracts and Rust numeric boundary; engine modules pending"
license = "Apache-2.0"

[tool.maturin]
manifest-path = "../../engine/crates/qf-python/Cargo.toml"
python-source = "."
module-name = "quantfoundry._native"
features = ["extension-module"]
