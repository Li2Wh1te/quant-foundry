name: S3 Rust contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: Core without Python or database client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install locked Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Test public core contract independently
        working-directory: engine
        env:
          PYO3_PYTHON: /nonexistent-python-core-must-not-use
        run: |
          cargo test -p qf-core --locked
          cargo run -p qf-core --locked --example public_contract
          qf_core_tree=$(cargo tree -p qf-core --locked)
          case "$qf_core_tree" in *pyo3*|*postgres*|*sqlx*) exit 1;; esac

  wheel:
    name: Python 3.12 wheel, numerics, contracts and shared tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-password
          POSTGRES_DB: quant_foundry_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d quant_foundry_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QF_ENVIRONMENT: test
      QF_API_TOKEN: ci-api-token-at-least-thirty-two-characters
      QF_CURSOR_SIGNING_KEY: ci-cursor-signing-key-at-least-thirty-two
      QF_DATABASE_HOST: 127.0.0.1
      QF_DATABASE_PORT: 5432
      QF_DATABASE_USER: postgres
      QF_DATABASE_PASSWORD: postgres-test-password
      QF_DATABASE_NAME: quant_foundry_test
      POSTGRES_TEST_ENABLED: "1"
      QF_S3_INTEGRATION_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Keep the wheel build directory for the integration consumer
        run: printf 'QF_S3_BUILD_ROOT=%s/s3-build\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.2"
      - name: Install locked Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Build and test installed wheel
        run: bash scripts/test_s3_engine.sh
      - name: D11 bounded ten-million module stream and real file-write failure
        run: |
          cargo build --manifest-path engine/Cargo.toml --locked --release -p qf-core --example result_stream
          python scripts/check_s3_results.py --events 10000000
      # Existing Validate workflow continues full backend/frontend testing.
      - uses: astral-sh/setup-uv@v5
      - name: Verify protected account, strategy and historical result consumers
        working-directory: backend
        env:
          QF_ENVIRONMENT: test
          QF_API_TOKEN: ci-api-token-at-least-thirty-two-characters
          QF_CURSOR_SIGNING_KEY: ci-cursor-signing-key-at-least-thirty-two
        run: |
          uv sync --locked
          uv run --locked alembic upgrade head
          uv run --locked python -m pytest -q tests/test_account_workspace.py tests/test_backtesting_account_profile_storage.py tests/test_strategy_storage.py tests/test_backtesting_pagination.py
      - name: Build the real Rust IPC consumer
        working-directory: engine
        run: cargo build -p qf-core --locked --example consume_gateway
      - name: CurrentStore to Arrow to Rust, consistency and release regressions
        working-directory: backend
        run: |
          uv pip install --python .venv/bin/python --no-deps "$QF_S3_BUILD_ROOT"/wheels/quantfoundry_sdk-*.whl
          uv run --locked --no-sync python -m pytest -q tests/test_s3_data_gateway.py tests/test_s3_research_api.py tests/test_s3_gateway_streams.py tests/test_s3_formal_runtime.py tests/test_s3_formal_assembly.py tests/test_s3_session_fact_pages.py tests/test_s3_formal_research_runtime.py tests/test_s3_sql_resolver.py tests/test_s3_sql_pages.py tests/test_s3_sql_scale.py tests/test_s3_default_producer.py tests/test_s3_resampled_runtime.py tests/test_s3_d18_diagnostics.py tests/test_s3_runtime_readiness.py
          # D11's ordinary HTTP route must also consume this installed wheel;
          # the general Validate job has no native wheel and cannot prove it.
          uv run --locked --no-sync python -m pytest -q tests/test_s2_market_adjustment_http_contract.py
      - name: D12 shared claim, batch and runner composition ports
        working-directory: backend
        run: uv run --locked --no-sync python -m pytest -q tests/test_s3_runtime_queue.py
      - name: D13 private database migration, HTTP, ownership and fenced results
        working-directory: backend
        env:
          QF_S3_D13_REQUIRED: "1"
          QF_D17_EVIDENCE: ${{ runner.temp }}/s3-retirement-evidence
        run: uv run --locked --no-sync python -m pytest -q tests/test_s3_run_service.py
      - name: D17 blocked startup, empty migrations and private cleanup refusal/apply
        working-directory: backend
        env:
          QF_D17_EVIDENCE: ${{ runner.temp }}/s3-retirement-evidence
        run: |
          # Keep PROCESS_ACTIVITY_UNKNOWN fail-closed. GitHub's same-UID
          # nondumpable listener needs a dedicated host-inspection test command;
          # no ptrace/sysctl, daemon or persistent permission setting is changed.
          sudo -n --preserve-env=QF_ENVIRONMENT,QF_API_TOKEN,QF_CURSOR_SIGNING_KEY,QF_DATABASE_HOST,QF_DATABASE_PORT,QF_DATABASE_USER,QF_DATABASE_PASSWORD,QF_DATABASE_NAME,POSTGRES_TEST_ENABLED,QF_D17_EVIDENCE \
            "$PWD/.venv/bin/python" -m pytest -q -p no:cacheprovider tests/s3_retirement_suite.py
          uv run --locked --no-sync python ../scripts/scan_legacy_dependencies.py --repo .. --max-bytes 33554432 --output "$RUNNER_TEMP/s3-retirement-evidence/inventory.json"
      # Diagnostic files remain in the disposable runner; CI status is the
      # published result. Do not upload logs, reports or machine-state bundles.
      - name: D14 installed CLI and HTTP clients, examples and migration protection
        working-directory: backend
        env:
          QF_S3_D14_REQUIRED: "1"
        run: uv run --locked --no-sync python -m pytest -q tests/test_s3_cli.py
