name: S3 full integration and release
on:
  pull_request:
    paths:
      - engine/**
      - sdk/python/**
      - backend/app/backtest_service/**
      - backend/app/data_store/**
      - backend/app/core/config.py
      - contracts/**
      - scripts/s3_release.py
      - scripts/build_s3_images.sh
      - scripts/test_s3_images.py
      - scripts/test_s3_startup.py
      - scripts/test_s3_runtime.sh
      - ops/s3-d12/**
      - ops/s3-d18/*.py
      - ops/s3-d18/*.Dockerfile
      - tests/s3_final_suite.py
      - .github/workflows/s3-final.yml
permissions:
  contents: read
concurrency:
  group: s3-final-${{ github.head_ref || github.ref }}
  # An unfinished measurement cannot validate a changed business head. Keep
  # one run per branch and let the current source replace obsolete work;
  # completed identical-source evidence is still verified before reuse.
  cancel-in-progress: true
jobs:
  impact:
    name: Select affected S3 verification
    runs-on: ubuntu-latest
    outputs:
      direct_spec_unchanged: ${{ steps.scope.outputs.direct_spec_unchanged }}
      backend_dependencies_only: ${{ steps.scope.outputs.backend_dependencies_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - id: scope
        env:
          QF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, subprocess
          changed = set(subprocess.check_output([
              'git', 'diff', '--name-only', os.environ['QF_BASE_SHA'], 'HEAD'
          ], text=True).splitlines())
          # These dependency paths do not participate in the old direct-Spec
          # B1-B4 workloads. The always-on Rust/wheel and worker workflows
          # still run their affected regressions on a supported filesystem.
          # Default preparation scale is a separate acceptance requirement;
          # skipping this unchanged workload is not its success evidence.
          # Runtime/UI CI still execute independently; their diagnostic-file
          # retention policy does not change the direct-Spec B1-B4 workloads.
          dependency_paths = {
              'backend/app/backtest_service/formal_resolver.py',
              'backend/app/backtest_service/formal_calendar_reader.py',
              'backend/app/backtest_service/formal_fact_guard.py',
              'backend/app/backtest_service/formal_sql_pages.py',
              'backend/app/backtest_service/formal_assembly.py',
              'backend/app/backtest_service/session_fact_pages.py',
              'backend/app/backtest_service/research_gateway.py',
              'backend/tests/test_s3_sql_resolver.py',
              'backend/tests/test_s3_sql_pages.py',
              'backend/tests/test_s3_formal_assembly.py',
              'backend/tests/test_s3_session_fact_pages.py',
              'backend/tests/test_s3_research_api.py',
              '.github/workflows/s3-engine.yml',
              '.github/workflows/s3-runtime.yml',
              '.github/workflows/s3-run-ui.yml',
              '.github/workflows/s3-final.yml',
          }
          print('backend_dependencies_only=' + str(bool(changed) and changed <= dependency_paths).lower())
          view_path = 'engine/crates/qf-core/src/data/views.rs'
          if view_path in changed:
              # B1-B4 do not call research(). Compare all other native code,
              # including price, adjustment, visibility and input validation.
              # A change outside this one method retains full verification.
              def without_research(revision):
                  source = subprocess.check_output(['git', 'show', revision + ':' + view_path], text=True)
                  before, start, rest = source.partition('    pub fn research(')
                  method, end, after = rest.partition('    pub fn adjust(')
                  if not start or not end or any(
                      line.startswith(('    pub fn ', '    fn ')) for line in method.splitlines()[1:]
                  ):
                      return None
                  return before + end + after
              previous, current = map(without_research, (os.environ['QF_BASE_SHA'], 'HEAD'))
              if previous is not None and previous == current:
                  dependency_paths.add(view_path)
          print('direct_spec_unchanged=' + str(bool(changed) and changed <= dependency_paths).lower())
          PY
  full:
    needs: impact
    if: needs.impact.outputs.direct_spec_unchanged != 'true'
    name: ${{ github.head_ref == 'codex/s3-review-default-runtime' && 'Affected full B2 60m in 4 CPU and 8 GiB group' || 'Full B1-B4 in 4 CPU and 8 GiB group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'
      - uses: astral-sh/setup-uv@v5
      - name: Check resources and construct locked release wheel
        run: |
          test "$(nproc)" -ge 4
          df -h "$RUNNER_TEMP"
          test "$(df -B1 --output=avail "$RUNNER_TEMP" | tail -1)" -ge 8589934592
          rustup toolchain install 1.90.0 --profile minimal
          python -m venv "$RUNNER_TEMP/s3-final/build"
          "$RUNNER_TEMP/s3-final/build/bin/python" -m pip install --require-hashes -r sdk/python/requirements-build.lock
          cd sdk/python
          python ../../scripts/s3_release.py snapshot --out "$RUNNER_TEMP/s3-final/native-before.json"
          "$RUNNER_TEMP/s3-final/build/bin/maturin" build --release --locked --interpreter "$RUNNER_TEMP/s3-final/build/bin/python" --out "$RUNNER_TEMP/s3-final/wheels"
          python ../../scripts/s3_release.py seal --manifest "$RUNNER_TEMP/s3-final/native-before.json" --wheel "$RUNNER_TEMP"/s3-final/wheels/*.whl --out "$RUNNER_TEMP/s3-final/release.json"
      - name: Offline release images and independent installed import
        env:
          QF_S3_BUILD_ROOT: ${{ runner.temp }}/s3-final
          QF_S3_RELEASE_ROOT: ${{ runner.temp }}/s3-final-release
        run: |
          bash scripts/build_s3_images.sh
          python scripts/test_s3_images.py "$QF_S3_RELEASE_ROOT/images.json"
          python scripts/test_s3_startup.py "$QF_S3_RELEASE_ROOT/images.json"
      - name: Key completed evidence by all measurement code and native binary
        id: source
        run: |
          python scripts/s3_release.py context --manifest "$RUNNER_TEMP/s3-final/release.json" --wheel "$RUNNER_TEMP"/s3-final/wheels/*.whl --out "$RUNNER_TEMP/s3-current-source.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          data = json.load(open(os.environ['RUNNER_TEMP'] + '/s3-current-source.json'))
          print('key=' + data['measurement_source']['sha256'] + '-' + data['build']['wheel']['native_sha256'])
          PY
      - uses: actions/cache@v4
        id: completed
        # This review changes hourly count selection. Keep the existing full
        # evidence; its affected B2/60m rerun is explicitly partial, never a
        # complete-source cache entry or a replacement B1-B4 certificate.
        if: github.head_ref != 'codex/s3-review-default-runtime'
        with:
          # A small result only. No source data, database or fixture is cached.
          path: ${{ runner.temp }}/s3-final-evidence/final-result.json
          key: s3-full-x86_64-${{ steps.source.outputs.key }}
      - name: Verify unchanged-source full evidence after documentation changes
        if: steps.completed.outputs.cache-hit == 'true'
        run: |
          python scripts/s3_release.py reuse --manifest "$RUNNER_TEMP/s3-current-source.json" --record "$RUNNER_TEMP/s3-final-evidence/final-result.json" --out "$RUNNER_TEMP/s3-final-evidence/reuse.json"
      - name: Real CurrentStore, PostgreSQL, runner container and sibling workers
        if: steps.completed.outputs.cache-hit != 'true'
        env:
          QF_S3_BUILD_ROOT: ${{ runner.temp }}/s3-final
          QF_S3_RUNTIME_EVIDENCE: ${{ runner.temp }}/s3-final-evidence
          QF_S3_FINAL: '1'
          QF_S3_FINAL_CASES: ${{ github.head_ref == 'codex/s3-review-default-runtime' && 'B2' || '' }}
          QF_S3_FINAL_FREQUENCIES: ${{ github.head_ref == 'codex/s3-review-default-runtime' && '60m' || '' }}
          QF_S3_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/test_s3_runtime.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.head_ref == 'codex/s3-review-default-runtime' && 's3-review-b2-60m-x86_64' || 's3-full-integration-x86_64' }}
          path: |
            ${{ runner.temp }}/s3-final-evidence/
            ${{ runner.temp }}/s3-final/wheels/
            ${{ runner.temp }}/s3-final/release.json
            ${{ runner.temp }}/s3-final-release/
          if-no-files-found: error
  arm:
    needs: impact
    if: needs.impact.outputs.backend_dependencies_only != 'true'
    name: Native Linux arm64 wheel install and smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'
      - uses: astral-sh/setup-uv@v5
      - name: Native build and independent installation
        env:
          QF_S3_BUILD_ROOT: ${{ runner.temp }}/s3-arm
        run: |
          test "$(uname -m)" = aarch64
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          bash scripts/test_s3_engine.sh
      - name: Native arm64 offline release images and installation
        env:
          QF_S3_BUILD_ROOT: ${{ runner.temp }}/s3-arm
          QF_S3_RELEASE_ROOT: ${{ runner.temp }}/s3-arm-release
        run: |
          bash scripts/build_s3_images.sh
          python scripts/test_s3_images.py "$QF_S3_RELEASE_ROOT/images.json"
          python scripts/test_s3_startup.py "$QF_S3_RELEASE_ROOT/images.json"
