# Prepared P01 overlay. Existing project/database/CurrentStore volumes are reused.
# Deployment owners must supply already approved identities and mount roots.
services:
  backend:
    image: ${QF_S3_BACKEND_IMAGE:?tested immutable backend image ID required}
    pull_policy: never
    user: ${QF_S3_TRUSTED_UID:?existing service UID required}:${QF_S3_TRUSTED_GID:?existing service GID required}
    environment:
      QF_S3_ACCEPT_NEW_RUNS: ${QF_S3_ACCEPT_NEW_RUNS:-false}
      QF_S3_WORKER_LIMITS: "${QF_S3_WORKER_LIMITS:-null}"
      QF_S3_GROUP_BUDGET: "${QF_S3_GROUP_BUDGET:-null}"
      QF_S3_RESULT_ROOT: /app/data/s3-results
      QF_S3_WORKER_IMAGE: ${QF_S3_WORKER_IMAGE:?tested immutable worker image ID required}
    volumes:
      - type: bind
        source: ${QF_S3_HOST_RESULT_ROOT:?approved result root required}
        target: /app/data/s3-results
  runner:
    image: ${QF_S3_BACKEND_IMAGE:?tested immutable backend image ID required}
    pull_policy: never
    user: ${QF_S3_TRUSTED_UID:?existing service UID required}:${QF_S3_TRUSTED_GID:?existing service GID required}
    command: [python, -m, app.runner]
    environment:
      QF_S3_WORK_ROOT: /qf-work
      QF_S3_WORKER_LIMITS: "${QF_S3_WORKER_LIMITS:-null}"
      QF_S3_GROUP_BUDGET: "${QF_S3_GROUP_BUDGET:-null}"
      QF_S3_DAEMON_WORK_ROOT: ${QF_S3_HOST_WORK_ROOT:?approved daemon host work root required}
      QF_S3_RESULT_ROOT: /app/data/s3-results
      QF_S3_WORKER_IMAGE: ${QF_S3_WORKER_IMAGE:?tested immutable worker image ID required}
    group_add:
      - ${QF_S3_DAEMON_SOCKET_GID:?already approved daemon access group required}
    volumes:
      - type: bind
        source: ${QF_S3_HOST_WORK_ROOT:?approved daemon host work root required}
        target: /qf-work
      - type: bind
        source: ${QF_S3_HOST_RESULT_ROOT:?approved result root required}
        target: /app/data/s3-results
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
