server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $backend_upstream http://backend:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # API and documentation traffic stays on the browser's origin while Nginx
    # forwards it through the private Compose network to the FastAPI container.
    location ~ ^/(api(?:/|$)|docs(?:/|$)|redoc(?:/|$)|openapi\.json$|readyz$) {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routes such as /login and /admin must resolve to the SPA
    # entry point when they are opened directly or refreshed in the browser.
    location / {
        # Nginx does not inherit server-level add_header directives when a
        # location defines its own header, so the baseline headers are repeated.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
